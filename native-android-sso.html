<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Login Google - Portable Inspection Tool</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg: #07131e;
      --card-bg: #0e2238;
      --border: #1a3c5a;
      --primary: #00f2fe;
      --primary-glow: rgba(0, 242, 254, 0.25);
      --text: #e2f1ff;
      --muted: #8aa4be;
      --danger: #ff5252;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at 50% 20%, #102a45 0%, #07131e 80%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .auth-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 20px var(--primary-glow);
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(0, 242, 254, 0.12);
      border: 1px solid var(--primary);
      color: var(--primary);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }
    p.subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .gis-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
      min-height: 44px;
    }
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 20px;
      background: #ffffff;
      color: #3c4043;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn-google:active {
      transform: scale(0.98);
    }
    .btn-google svg {
      width: 20px;
      height: 20px;
    }
    .status-box {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
      word-break: break-word;
    }
    .status-box.loading {
      display: block;
      background: rgba(0, 242, 254, 0.1);
      border: 1px solid var(--primary);
      color: var(--primary);
    }
    .status-box.error {
      display: block;
      background: rgba(255, 82, 82, 0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
    }
    .status-box.success {
      display: block;
      background: rgba(76, 175, 80, 0.15);
      border: 1px solid #4caf50;
      color: #81c784;
    }
    .footer-link {
      margin-top: 24px;
      display: block;
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
    }
    .footer-link:hover {
      color: var(--primary);
    }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--primary);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="badge">SECURE INDUSTRIAL SSO</div>
    <h1>Portable Inspection Tool</h1>
    <p class="subtitle">Masuk dengan akun Google Anda untuk sinkronisasi otomatis data inspeksi dan checklist lapangan.</p>

    <!-- Google Identity Services Container -->
    <div id="g_id_onload"
         data-client_id="164055402853-jl4hp3av4lndda0oiks1knrca4vqka7o.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="onGoogleCredentialResponse"
         data-auto_prompt="true">
    </div>

    <div class="gis-wrapper">
      <div class="g_id_signin"
           data-type="standard"
           data-shape="rectangular"
           data-theme="outline"
           data-text="signin_with"
           data-size="large"
           data-logo_alignment="left"
           data-width="320">
      </div>
    </div>

    <button id="btnGoogle" class="btn-google">
      <svg viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Continue with Firebase Auth
    </button>

    <div id="statusBox" class="status-box"></div>

    <a href="plirm34://auth" class="footer-link">← Kembali ke Aplikasi Portable Inspection Tool</a>
  </div>

  <script>
    function setStatus(type, message) {
      const statusBox = document.getElementById("statusBox");
      statusBox.className = "status-box " + type;
      if (type === 'loading') {
        statusBox.innerHTML = '<span class="spinner"></span> ' + message;
      } else {
        statusBox.innerHTML = message;
      }
    }

    async function handleAuthSuccess(idToken, extra) {
      setStatus("loading", "Memverifikasi akun Google ke server PLIRM34...");
      try {
        const payload = { id_token: idToken };
        if (extra && extra.email) payload.email = extra.email;
        if (extra && extra.name) payload.name = extra.name;

        const res = await fetch("/api/auth/google", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (data.token) {
          setStatus("success", "Login Google berhasil! Membuka Portable Inspection Tool...");
          setTimeout(() => {
            window.location.href = "plirm34://auth?token=" + encodeURIComponent(data.token);
          }, 500);
        } else {
          setStatus("error", "Login gagal: " + (data.error || "Gagal membuat sesi"));
        }
      } catch (err) {
        setStatus("error", "Error verifikasi: " + err.message);
      }
    }

    // Callback for Google Identity Services
    window.onGoogleCredentialResponse = function(response) {
      if (response && response.credential) {
        handleAuthSuccess(response.credential);
      }
    };
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const btnGoogle = document.getElementById("btnGoogle");

    async function initFirebase() {
      let config = {
        apiKey: "AIzaSyCSd1hhJe0cYlg2PKNSRxIeFXZf54OoCIA",
        authDomain: "portable-tool-inspection.firebaseapp.com",
        projectId: "portable-tool-inspection",
        storageBucket: "portable-tool-inspection.firebasestorage.app",
        messagingSenderId: "164055402853",
        appId: "1:164055402853:android:22857fbad0c128e0d7798c"
      };

      try {
        const res = await fetch("/api/auth/firebase-config");
        if (res.ok) {
          const remote = await res.json();
          if (remote.apiKey) config = remote;
        }
      } catch (e) {}

      btnGoogle.addEventListener("click", async () => {
        setStatus("loading", "Membuka otentikasi Google...");
        btnGoogle.disabled = true;

        try {
          const app = initializeApp(config);
          const auth = getAuth(app);
          const provider = new GoogleAuthProvider();
          provider.setCustomParameters({ prompt: 'select_account' });

          const userCred = await signInWithPopup(auth, provider);
          const credential = GoogleAuthProvider.credentialFromResult(userCred);
          const googleIdToken = credential?.idToken;
          const firebaseIdToken = await userCred.user.getIdToken();

          await handleAuthSuccess(googleIdToken || firebaseIdToken, {
            email: userCred.user.email,
            name: userCred.user.displayName
          });
        } catch (err) {
          console.error(err);
          let msg = err.message || "Gagal masuk dengan Google.";
          if (err.code === "auth/unauthorized-domain") {
            msg = "Domain plirm34tuban.id belum didaftarkan di Authorized Domains Firebase Console.";
          } else if (err.code === "auth/popup-closed-by-user") {
            msg = "Jendela login ditutup sebelum selesai.";
          }
          setStatus("error", msg);
          btnGoogle.disabled = false;
        }
      });
    }

    initFirebase();
  </script>
</body>
</html>

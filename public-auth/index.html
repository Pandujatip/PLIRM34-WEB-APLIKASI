<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Login Google - Maintenance Tool Online</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg: #07131e;
      --card-bg: #0e2238;
      --border: #1a3c5a;
      --primary: #00f2fe;
      --primary-glow: rgba(0, 242, 254, 0.25);
      --text: #e2f1ff;
      --muted: #8aa4be;
      --danger: #ff5252;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at 50% 20%, #102a45 0%, #07131e 80%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .auth-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 20px var(--primary-glow);
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(0, 242, 254, 0.12);
      border: 1px solid var(--primary);
      color: var(--primary);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }
    p.subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .gis-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
      min-height: 48px;
    }
    .status-box {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.4;
      display: none;
      text-align: left;
    }
    .status-box.loading {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 242, 254, 0.1);
      color: var(--primary);
      border: 1px solid rgba(0, 242, 254, 0.2);
    }
    .status-box.success {
      display: block;
      background: rgba(16, 185, 129, 0.12);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .status-box.error {
      display: block;
      background: rgba(255, 82, 82, 0.12);
      color: var(--danger);
      border: 1px solid rgba(255, 82, 82, 0.3);
    }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(0, 242, 254, 0.3);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn-manual-return {
      display: none;
      margin-top: 14px;
      padding: 12px 16px;
      background: var(--primary);
      color: #07131e;
      font-weight: 700;
      font-size: 13px;
      border-radius: 10px;
      text-decoration: none;
    }
    .footer-link {
      margin-top: 20px;
      display: inline-block;
      font-size: 12px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="badge">SECURE INDUSTRIAL SSO</div>
    <h1>Maintenance Tool Online</h1>
    <p class="subtitle">Masuk dengan akun Google Anda untuk sinkronisasi otomatis data inspeksi dan maintenance Tuban 1 - Tuban 4.</p>

    <!-- Google Identity Services Container -->
    <div id="g_id_onload"
         data-client_id="164055402853-jl4hp3av4lndda0oiks1knrca4vqka7o.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="onGoogleCredentialResponse"
         data-auto_prompt="false">
    </div>

    <div class="gis-wrapper">
      <div class="g_id_signin"
           data-type="standard"
           data-shape="rectangular"
           data-theme="outline"
           data-text="signin_with"
           data-size="large"
           data-logo_alignment="left"
           data-width="320">
      </div>
    </div>

    <div id="statusBox" class="status-box"></div>
    <a id="btnManualReturn" href="plirm34://auth" class="btn-manual-return">Buka Maintenance Tool Online</a>

    <a href="plirm34://auth" class="footer-link">← Kembali ke Aplikasi Maintenance Tool Online</a>
  </div>

  <script>
    const BACKEND_BASE = (window.location.origin.indexOf("plirm34tuban.id") !== -1) 
      ? window.location.origin 
      : "https://plirm34tuban.id";

    function setStatus(type, message) {
      const statusBox = document.getElementById("statusBox");
      statusBox.className = "status-box " + type;
      if (type === 'loading') {
        statusBox.innerHTML = '<span class="spinner"></span> ' + message;
      } else {
        statusBox.innerText = message;
      }
    }

    async function handleAuthSuccess(idToken, extra) {
      setStatus("loading", "Memverifikasi akun Google ke server PLIRM34...");
      try {
        const payload = { id_token: idToken };
        if (extra && extra.email) payload.email = extra.email;
        if (extra && extra.name) payload.name = extra.name;

        const res = await fetch(BACKEND_BASE + "/api/auth/google", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (data.token) {
          setStatus("success", "Login Google berhasil! Mengalihkan ke Maintenance Tool Online...");

          const params = new URLSearchParams();
          params.set("token", data.token);
          if (data.user && data.user.role) params.set("role", data.user.role);
          if (data.user && data.user.username) params.set("username", data.user.username);

          // Support custom return_url / redirect_uri (useful for web preview)
          const currentUrlParams = new URLSearchParams(window.location.search);
          const customReturn = currentUrlParams.get("return_url") || currentUrlParams.get("redirect_uri");

          let returnUrl;
          if (customReturn) {
            const separator = customReturn.indexOf("?") !== -1 ? "&" : "?";
            returnUrl = customReturn + separator + params.toString();
          } else {
            returnUrl = "plirm34://auth?" + params.toString();
          }

          // Notify window.opener if opened in popup
          if (window.opener && window.opener !== window) {
            try {
              window.opener.postMessage({
                type: "PLIRM34_AUTH_TOKEN",
                token: data.token,
                user: data.user
              }, "*");
            } catch (_) {}
          }

          const btnManual = document.getElementById("btnManualReturn");
          if (btnManual) {
            btnManual.href = returnUrl;
            btnManual.style.display = "block";
            btnManual.innerText = "Buka Maintenance Tool Online (" + (data.user?.username || "Google") + ")";
          }
          setTimeout(() => {
            window.location.href = returnUrl;
          }, 400);
        } else {
          setStatus("error", "Login gagal: " + (data.error || "Gagal membuat sesi"));
        }
      } catch (err) {
        setStatus("error", "Error verifikasi: " + err.message);
      }
    }

    // Callback for Google Identity Services
    window.onGoogleCredentialResponse = function(response) {
      if (response && response.credential) {
        handleAuthSuccess(response.credential);
      }
    };
  </script>
</body>
</html>
